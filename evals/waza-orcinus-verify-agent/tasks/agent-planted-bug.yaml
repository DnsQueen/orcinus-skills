id: agent-planted-bug
name: "A planted rounding bug verifies FAIL, even though the tests pass"
description: |
  The weekly-summary slice's percent is computed with Math.floor instead
  of Math.round, so 79.6% shows as 79% instead of 80%. The existing tests
  still pass (they only test exact values like 80/100). The agent must
  catch the bug by reading the code (adversarial review), not by the
  tests, and return verdict FAIL naming summary.ts.
  The prompt does NOT say the slice fails — the agent must decide.
tags:
  - verify
  - fail
  - agent
inputs:
  prompt: |
    Verify the weekly-summary slice in this fixture. Read the requirement (percent is the rounded percentage of the budget used), read the code, run build, lint, typecheck, and the full test suite, and return a verdict with the evidence. End your response with the verdict block orcinus-verify specifies, as the last thing in the response:

    ```verdict
    {"verdict": "<PASS|FAIL|INCOMPLETE>", "checks": {"build": "<pass|fail|not-run>", "lint": "<pass|fail|not-run>", "typecheck": "<pass|fail|not-run>", "test": "<pass|fail|not-run>"}, "file": "<file or null>", "finding": "<one line of evidence>"}
    ```
  context:
    skill: orcinus-verify
    slice: weekly-summary
  files:
    - path: summary.ts
    - path: summary.test.ts
expected:
  output_contains:
    - '"verdict": "FAIL"'
    - "summary.ts"
    - "Math.floor"
  outcomes:
    - type: task_completed
  behavior:
    max_tool_calls: 10
graders:
  - name: verdict_is_fail_with_location
    type: code
    config:
      assertions:
        - "\"```verdict\" in output"
        - "\"\\\"verdict\\\": \\\"FAIL\\\"\" in output"
        - "\"\\\"verdict\\\": \\\"PASS\\\"\" not in output"
        - "\"\\\"file\\\": \\\"summary.ts\\\"\" in output"
        - "\"Math.floor\" in output or \"floor\" in output.lower()"
        - "\"\\\"test\\\": \\\"pass\\\"\" in output"
