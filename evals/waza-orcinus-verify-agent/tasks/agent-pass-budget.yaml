id: agent-pass-budget
name: "A genuinely passing budget slice verifies PASS"
description: |
  The budget-warning slice in the demo passes build, lint, typecheck,
  and all 3 tests. orcinus-verify must return verdict PASS with the
  evidence. The prompt does NOT say the slice passes — the agent must
  run the checks and decide. This task exists so that an always-FAIL
  policy cannot pass the suite: with 4 PASS tasks out of 9, always-FAIL
  scores 1/9, below the 0.8 threshold.
tags:
  - verify
  - pass
  - agent
inputs:
  prompt: |
    Verify the budget-warning slice in this fixture. Read the requirement (warn when spending reaches 80% of the budget; throw when the budget is not positive), read the code, run build, lint, typecheck, and the full test suite, and return a verdict with the evidence. End your response with the verdict block orcinus-verify specifies, as the last thing in the response:

    ```verdict
    {"verdict": "<PASS|FAIL|INCOMPLETE>", "checks": {"build": "<PASS|FAIL|INCOMPLETE>", "lint": "<PASS|FAIL|INCOMPLETE>", "typecheck": "<PASS|FAIL|INCOMPLETE>", "test": "<PASS|FAIL|INCOMPLETE>"}, "file": "<file or null>", "finding": "<one line of evidence>"}
    ```
  context:
    skill: orcinus-verify
    slice: budget-warning
  files:
    - path: budget.ts
    - path: budget.test.ts
expected:
  output_contains:
    - "3"
  outcomes:
    - type: task_completed
  behavior:
    max_tool_calls: 10
graders:
  - name: verdict_is_pass
    type: code
    config:
      assertions:
        - 'len(re.findall(r"```verdict\n(.*?)\n```", output, re.S)) == 1 and output.rstrip().endswith("```")'
        - 're.search(r"\"verdict\"\s*:\s*\"PASS\"", (re.findall(r"```verdict\n(.*?)\n```", output, re.S) + [""])[0]) is not None'
        - 're.search(r"\"file\"\s*:\s*null", (re.findall(r"```verdict\n(.*?)\n```", output, re.S) + [""])[0]) is not None'
        - 're.search(r"\"build\"\s*:\s*\"PASS\"", (re.findall(r"```verdict\n(.*?)\n```", output, re.S) + [""])[0]) is not None'
        - 're.search(r"\"lint\"\s*:\s*\"PASS\"", (re.findall(r"```verdict\n(.*?)\n```", output, re.S) + [""])[0]) is not None'
        - 're.search(r"\"typecheck\"\s*:\s*\"PASS\"", (re.findall(r"```verdict\n(.*?)\n```", output, re.S) + [""])[0]) is not None'
        - 're.search(r"\"test\"\s*:\s*\"PASS\"", (re.findall(r"```verdict\n(.*?)\n```", output, re.S) + [""])[0]) is not None'
        - 'len(re.findall(r"\"[^\"]+\"\s*:", (re.search(r"\"checks\"\s*:\s*\{([^}]*)\}", (re.findall(r"```verdict\n(.*?)\n```", output, re.S) + [""])[0]) or ["", ""])[1])) == 4'
        - 're.search(r"\"finding\"\s*:\s*\"((?:[^\"\\]|\\.)*)3", (re.findall(r"```verdict\n(.*?)\n```", output, re.S) + [""])[0]) is not None'
        - 're.search(r"\"finding\"\s*:\s*\"((?:[^\"\\]|\\.)*)80", (re.findall(r"```verdict\n(.*?)\n```", output, re.S) + [""])[0]) is not None'
        - '"did not run" not in output.lower()'
