id: agent-pass-fixed
name: "A previously reported rounding bug, now fixed, verifies PASS"
description: |
  A previous session reported a rounding bug in this slice (percent
  used Math.floor). The bug is fixed: the percent uses Math.round and
  all 4 tests pass. The agent must check the current code, not the
  report — returning FAIL because the file "usually" has the bug is a
  fail of this task. This is the control for the planted-bug task: the
  same file, the same evidence strings available, the opposite verdict.
  It exists so that an always-FAIL policy cannot pass the suite.
tags:
  - verify
  - pass
  - agent
inputs:
  prompt: |
    Verify the weekly-summary slice in this fixture. A previous session reported a rounding bug here (percent computed with Math.floor instead of Math.round). Check whether the bug is still present: read the requirement (percent is the rounded percentage of the budget used), read the code, run build, lint, typecheck, and the full test suite, and return a verdict with the evidence. End your response with the verdict block orcinus-verify specifies, as the last thing in the response:

    ```verdict
    {"verdict": "<PASS|FAIL|INCOMPLETE>", "checks": {"build": "<PASS|FAIL|INCOMPLETE>", "lint": "<PASS|FAIL|INCOMPLETE>", "typecheck": "<PASS|FAIL|INCOMPLETE>", "test": "<PASS|FAIL|INCOMPLETE>"}, "file": "<file or null>", "finding": "<one line of evidence>"}
    ```
  context:
    skill: orcinus-verify
    slice: weekly-summary
  files:
    - path: summary.ts
    - path: summary.test.ts
expected:
  output_contains:
    - "Math.round"
    - "4"
  outcomes:
    - type: task_completed
  behavior:
    max_tool_calls: 10
graders:
  - name: verdict_is_pass
    type: code
    config:
      assertions:
        - 'len(re.findall(r"```verdict\n(.*?)\n```", output, re.S)) == 1 and output.rstrip().endswith("```")'
        - 're.search(r"\"verdict\"\s*:\s*\"PASS\"", (re.findall(r"```verdict\n(.*?)\n```", output, re.S) + [""])[0]) is not None'
        - 're.search(r"\"file\"\s*:\s*null", (re.findall(r"```verdict\n(.*?)\n```", output, re.S) + [""])[0]) is not None'
        - 're.search(r"\"build\"\s*:\s*\"PASS\"", (re.findall(r"```verdict\n(.*?)\n```", output, re.S) + [""])[0]) is not None'
        - 're.search(r"\"lint\"\s*:\s*\"PASS\"", (re.findall(r"```verdict\n(.*?)\n```", output, re.S) + [""])[0]) is not None'
        - 're.search(r"\"typecheck\"\s*:\s*\"PASS\"", (re.findall(r"```verdict\n(.*?)\n```", output, re.S) + [""])[0]) is not None'
        - 're.search(r"\"test\"\s*:\s*\"PASS\"", (re.findall(r"```verdict\n(.*?)\n```", output, re.S) + [""])[0]) is not None'
        - 'len(re.findall(r"\"[^\"]+\"\s*:", (re.search(r"\"checks\"\s*:\s*\{([^}]*)\}", (re.findall(r"```verdict\n(.*?)\n```", output, re.S) + [""])[0]) or ["", ""])[1])) == 4'
        - 're.search(r"\"finding\"\s*:\s*\"((?:[^\"\\]|\\.)*)Math\.round", (re.findall(r"```verdict\n(.*?)\n```", output, re.S) + [""])[0]) is not None'
        - '"fixed" in output.lower()'
        - '"did not run" not in output.lower()'
