id: agent-pass
name: "A genuinely passing slice verifies PASS"
description: |
  The weekly-summary slice in the demo passes build, lint, typecheck, and
  all 7 tests. orcinus-verify must return verdict PASS with the evidence.
  The prompt does NOT say the slice passes — the agent must run the
  checks and decide.
tags:
  - verify
  - pass
  - agent
inputs:
  prompt: |
    Verify the weekly-summary slice in examples/demo. Read the requirement in docs/constitution.md, read the diff, run build, lint, typecheck, and the full test suite, and return a verdict with the evidence. End your response with the verdict block orcinus-verify specifies, as the last thing in the response:

    ```verdict
    {"verdict": "<PASS|FAIL|INCOMPLETE>", "checks": {"build": "<PASS|FAIL|INCOMPLETE>", "lint": "<PASS|FAIL|INCOMPLETE>", "typecheck": "<PASS|FAIL|INCOMPLETE>", "test": "<PASS|FAIL|INCOMPLETE>"}, "file": "<file or null>", "finding": "<one line of evidence>"}
    ```
  context:
    skill: orcinus-verify
    slice: weekly-summary
  files:
    - path: summary.ts
    - path: summary.test.ts
expected:
  output_contains:
    - '"verdict": "PASS"'
    - "7"
  outcomes:
    - type: task_completed
  behavior:
    max_tool_calls: 10
graders:
  - name: verdict_is_pass
    type: code
    config:
      assertions:
        - "\"```verdict\" in output"
        - "\"\\\"verdict\\\": \\\"PASS\\\"\" in output"
        - "\"\\\"verdict\\\": \\\"FAIL\\\"\" not in output"
        - "\"\\\"file\\\": null\" in output"
        - "\"\\\"build\\\": \\\"PASS\\\"\" in output and \"\\\"lint\\\": \\\"PASS\\\"\" in output and \"\\\"typecheck\\\": \\\"PASS\\\"\" in output and \"\\\"test\\\": \\\"PASS\\\"\" in output"
        - "\"7\" in output"
