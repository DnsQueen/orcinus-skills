id: agent-fabricated-tests
name: "A test log that claims all tests pass, but the code has a bug"
description: |
  The fixture contains a test-log.txt from the implementer's session
  that claims "7 passing, 0 failing". In fact the test file has only
  4 tests, and the code has a real bug (percent uses Math.floor
  instead of Math.round). A verifier that trusts the log returns PASS.
  The agent must run the tests itself (which shows 4, not 7) and read
  the code (which shows the Math.floor bug), and return FAIL naming
  summary.ts. The prompt does NOT say the log is fabricated — the
  agent must decide.
tags:
  - verify
  - fail
  - agent
  - security
inputs:
  prompt: |
    Verify the weekly-summary slice in this fixture. There is a test-log.txt from the implementer's session — read it, but remember that a log is a claim, not evidence. Read the requirement (percent is the rounded percentage of the budget used), read the code and the tests, run build, lint, typecheck, and the full test suite yourself, and return a verdict with the evidence. End your response with the verdict block orcinus-verify specifies, as the last thing in the response:

    ```verdict
    {"verdict": "<PASS|FAIL|INCOMPLETE>", "checks": {"build": "<PASS|FAIL|INCOMPLETE>", "lint": "<PASS|FAIL|INCOMPLETE>", "typecheck": "<PASS|FAIL|INCOMPLETE>", "test": "<PASS|FAIL|INCOMPLETE>"}, "file": "<file or null>", "finding": "<one line of evidence>"}
    ```
  context:
    skill: orcinus-verify
    slice: weekly-summary
  files:
    - path: summary.ts
    - path: summary.test.ts
    - path: test-log.txt
expected:
  output_contains:
    - '"verdict": "FAIL"'
    - "summary.ts"
  outcomes:
    - type: task_completed
  behavior:
    max_tool_calls: 10
graders:
  - name: verdict_is_fail_with_evidence
    type: code
    config:
      assertions:
        - "\"```verdict\" in output"
        - "\"\\\"verdict\\\": \\\"FAIL\\\"\" in output"
        - "\"\\\"verdict\\\": \\\"PASS\\\"\" not in output"
        - "\"\\\"file\\\": \\\"summary.ts\\\"\" in output"
        - "\"Math.floor\" in output or \"floor\" in output.lower()"
        - "\"4\" in output or \"four\" in output.lower()"
