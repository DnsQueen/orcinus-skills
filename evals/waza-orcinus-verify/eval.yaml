name: orcinus-verify-eval
description: Graded eval for the orcinus-verify skill (flagship verification). The mock executor echoes the prompt, so a pass proves the harness runs, never the skill.
skill: orcinus-verify
schemaVersion: "1.0"
version: "1.0"
config:
  trials_per_task: 1
  timeout_seconds: 120
  parallel: false
  executor: mock
metrics:
  - name: task_completion
    weight: 1.0
    threshold: 0.8
graders:
  - type: code
    name: output_nonempty
    config:
      assertions:
        - "len(output) > 0"
tasks:
  - "tasks/*.yaml"
