id: review-clean
name: "A clean change passes"
description: |
  The fixture is a correct applyDiscount: SAVE10 gives 10% off, unknown codes throw, and three tests cover the happy path, the unknown code, and the empty code. The agent must review the diff and the code, run the reviewers that apply — including code-simplifier, which runs only after a review passes — and return PASS with no critical issues. The prompt does NOT state the verdict — the agent must read the fixture.
tags:
  - independent-review
  - pass
inputs:
  prompt: |
    Review the change in this fixture, following the independent-review skill. Read diff.txt and the changed files, run the reviewers that apply, and aggregate them into the report in the form the skill specifies, with a verdict. End your response with the review block, as the last thing in the response:

    ```review
    {"verdict": "PASS"|"FAIL", "file": "<file or null>", "finding": "<one line of evidence>"}
    ```
  context:
    skill: independent-review
  files:
    - path: diff.txt
    - path: discount.ts
    - path: discount.test.ts
expected:
  output_contains:
    - "code-simplifier"
  outcomes:
    - type: task_completed
  behavior:
    max_tool_calls: 10
graders:
  - name: verdict_is_pass
    type: code
    config:
      assertions:
        - 'len(re.findall(r"```review\n(.*?)\n```", output, re.S)) == 1 and output.rstrip().endswith("```")'
        - 're.search(r"\"verdict\"\s*:\s*\"PASS\"", (re.findall(r"```review\n(.*?)\n```", output, re.S) + [""])[0]) is not None'
        - 're.search(r"\"file\"\s*:\s*null", (re.findall(r"```review\n(.*?)\n```", output, re.S) + [""])[0]) is not None'
        - '"code-simplifier" in output'
