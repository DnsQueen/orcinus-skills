name: CI

# ORCINUS practices verification-first on itself: every change must
# pass the repo validator, the script tests, and the waza
# harness-smoke suite. The waza suite uses the mock executor, so it
# proves the harness (schema, tasks, graders, results JSON), never
# agent quality. The agent-behavior suite
# (evals/waza-orcinus-verify-agent/) needs a real agent executor and
# is not run in CI.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install pytest
      - name: Validate the repo (frontmatter, licences, glossary, stage ranges, manifests, links)
        run: python3 scripts/validate_repo.py
      - name: Check vendored files have not drifted
        run: python3 scripts/check_drift.py
      - name: Run the script tests
        run: python3 -m pytest -q
      - name: Install waza (v0.40.0, checksum verified)
        run: |
          curl -sL -o /tmp/waza-linux-amd64 https://github.com/microsoft/waza/releases/download/v0.40.0/waza-linux-amd64
          curl -sL -o /tmp/checksums.txt https://github.com/microsoft/waza/releases/download/v0.40.0/checksums.txt
          cd /tmp && grep 'waza-linux-amd64' checksums.txt | sha256sum -c -
          chmod +x /tmp/waza-linux-amd64
          /tmp/waza-linux-amd64 --help | head -n 3
      - name: Run the waza harness-smoke suite (mock executor)
        run: /tmp/waza-linux-amd64 run evals/waza-orcinus-verify/eval.yaml --output /tmp/waza-results.json
