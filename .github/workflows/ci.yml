name: CI

# ORCINUS practices verification-first on itself: every change must
# pass the repo validator, the drift check, the linter, the script
# tests, and the waza harness-smoke suite. The waza suite uses the
# mock executor, so it proves the harness (schema, tasks, graders,
# results JSON), never agent quality. The agent-behavior suite
# (evals/waza-orcinus-verify-agent/) needs a real agent executor and
# is not run in CI.
#
# Actions are pinned by full commit SHA, not by tag, so a compromised
# or moved tag cannot change what CI runs. To update an action, fetch
# the new SHA from the GitHub API
# (GET /repos/<owner>/<repo>/git/ref/tags/<tag>) and replace the SHA
# below, keeping the "# <action>@<tag>" comment in sync.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Portability claim (round 6, CI-1): the test job runs on
    # ubuntu, Windows, and macOS, because the suite must pass where
    # the user runs it — POSIX assumptions in the tests (shell paths,
    # /tmp, signal handling) are the usual way a platform breaks.
    # Python 3.10 was dropped 2026-11-07 (round 6, 2-S7):
    # end-of-life 2026-10-01 (PEP 619). Run 42407636694 (2026-11-07,
    # commit e80ed62, v0.9.8) was green on all 14 jobs, including
    # windows-latest and macos-latest — the POSIX assumptions held.
    # A red win/mac job is still a real finding to fix, not a reason
    # to drop the platform.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CI dependencies (pinned, hashes verified)
        run: pip install --require-hashes -r requirements-ci.txt
      - name: Validate the repo (frontmatter, licences, glossary, stage ranges, manifests, links, skill counts)
        run: python scripts/validate_repo.py
      - name: Check vendored files have not drifted
        run: python scripts/check_drift.py
      - name: Lint the ORCINUS-owned Python (ruff, see pyproject.toml)
        run: python -m ruff check
      - name: Check formatting of the ORCINUS-owned Python and Markdown code blocks
        run: python -m ruff format --check
      - name: Typecheck the ORCINUS-owned Python (mypy, scope is [tool.mypy] files in pyproject.toml)
        run: python -m mypy
      - name: Run the script tests
        run: python -m pytest -q

  waza:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
      - name: Install waza (v0.40.0, checksum pinned in this file)
        # Round 6 (2-S6): the checksum used to be downloaded from
        # the same release it verified, so it was not anti-forgery —
        # a compromised release could ship a matching pair. The
        # SHA256 below is pinned in this file and must match
        # doctor.WAZA_LINUX_SHA256 in scripts/doctor.py (enforced by
        # scripts/test_doctor.py).
        run: |
          curl -fsSL -o /tmp/waza-linux-amd64 https://github.com/microsoft/waza/releases/download/v0.40.0/waza-linux-amd64
          echo "d09117a3c631f44a00a6c362462c951aed83c87751e8c25f39916a77d1013802  /tmp/waza-linux-amd64" | sha256sum -c -
          chmod +x /tmp/waza-linux-amd64
          /tmp/waza-linux-amd64 --help | head -n 3
      - name: Run the waza harness-smoke suite (mock executor)
        run: /tmp/waza-linux-amd64 run evals/waza-orcinus-verify/eval.yaml --output /tmp/waza-results.json
      - name: Run the mock negative control (must fail by design)
        # Round 7 (F-10): the control task's prompt, name and
        # description omit the verdict word, so the mock echo cannot
        # pass its grader. The run must exit non-zero with exactly
        # 1 failed task; if it exits 0 the grader is vacuous. The
        # results JSON is asserted too, so the check does not depend
        # on the exit code alone (the real binary exits 1 on a
        # failed task — evidence-eval-01.md Case 2). The control is
        # a separate suite, not a third task in the main suite, so
        # the main run's contract (2/2, exit 0) is unchanged.
        run: |
          set +e
          /tmp/waza-linux-amd64 run evals/waza-orcinus-verify/control/eval.yaml --output /tmp/waza-control-results.json
          status=$?
          set -e
          test -f /tmp/waza-control-results.json || { echo "control run wrote no results JSON"; exit 1; }
          python3 -c "import json, sys; s = json.load(open('/tmp/waza-control-results.json'))['summary']; assert s['total_tests'] == 1 and s['succeeded'] == 0 and s['failed'] == 1, s; print('negative control failed as designed:', s)"
          test "$status" -ne 0 || { echo "negative control unexpectedly exited 0 — the grader is vacuous"; exit 1; }
      - name: Upload the waza results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: waza-results
          path: /tmp/waza-results.json
          if-no-files-found: error

  demo:
    # Round 6 (2-S5 / 3-R3-07): the demo had zero CI coverage — no
    # job referenced examples/demo at all, so a broken demo shipped
    # silently. Runs the five gates (build, lint, typecheck, test,
    # mutation) on the minimum supported Node (22 — the Stryker
    # packages require >=22, see examples/demo/package.json engines)
    # and on the release Node (24). Mutation takes ~3 minutes
    # (30 mutants, whole-suite re-run per mutant); the break
    # threshold is 80 (examples/demo/stryker.config.mjs).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install the demo dependencies from the lockfile
        run: npm ci
        working-directory: examples/demo
      - name: Build, lint, typecheck, and test the demo
        run: npm run build && npm run lint && npm run typecheck && npm test
        working-directory: examples/demo
      - name: Run mutation testing (Stryker, break 80)
        run: npm run mutation
        working-directory: examples/demo

  waza-fixtures:
    # Round 6 (Track 6 handoff): the waza harness-smoke fixtures
    # (evals/waza-orcinus-verify-agent/fixtures/) have their own
    # package.json + tsconfig + eslint config and their own four
    # gates — same shape as the demo job, Node 24 only (no Stryker
    # here, so no minimum-version matrix is needed).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install the fixture dependencies from the lockfile
        run: npm ci
        working-directory: evals/waza-orcinus-verify-agent/fixtures
      - name: Build, lint, typecheck, and test the fixtures
        run: npm run build && npm run lint && npm run typecheck && npm test
        working-directory: evals/waza-orcinus-verify-agent/fixtures

  shellcheck:
    # Round 6 (2-S5): CI had no shellcheck, so the shell scripts
    # (verify.sh, hitl-loop.template.sh) were linted only by hand.
    # apt-get update first: a bare install fails on a stale index
    # ("Unable to locate package shellcheck").
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint the shell scripts
        run: shellcheck $(git ls-files '*.sh')

  clean-install:
    # Proves the repo works from a clean copy, not just in the author's
    # working tree: copies it to a fresh temp dir and runs the gates
    # there. A real `claude plugin install` still needs a machine with
    # Claude Code and is not run here (see SCOPE.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CI dependencies (pinned, hashes verified)
        run: pip install --require-hashes -r requirements-ci.txt
      - name: "Clean-environment install check (release mode: the committed revision only)"
        run: python3 scripts/clean_copy_check.py --mode release

  version-bump:
    # A push that ships plugin content (skills/, agents/, commands/,
    # scripts/) must bump the version and the changelog in the same
    # push — and a version bump without a changelog entry fails even
    # when nothing shipped changed (see
    # scripts/check_version_bump.py). The version must also
    # INCREASE: greater than the base version and greater than the
    # latest release tag, so a downgrade or a bump to an
    # already-released version fails. Runs on pushes AND pull
    # requests, so a PR gets the feedback before it merges instead
    # of after. The base is the PR's base SHA on pull_request
    # events and the push's before SHA on push events; it is not in
    # a depth-1 checkout, so it is fetched first. The fetch has no
    # `|| true`: a failed fetch must fail the job loudly with git's
    # own error, not be swallowed and re-reported as a generic
    # "cannot resolve base" — and if the base was force-pushed away
    # it no longer exists upstream, so the job fails instead of
    # passing on a stale base. The release tags are fetched too,
    # for the increase-against-latest-tag check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
      - name: Fetch the base commit
        run: git fetch --depth=1 origin ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Fetch the release tags
        run: git fetch --depth=1 origin --tags
      - name: Check the version was bumped with skill changes
        run: python3 scripts/check_version_bump.py --base ${{ github.event.pull_request.base.sha || github.event.before }} --head ${{ github.sha }}

  plugin-validate:
    # The official Claude Code plugin validator, on a fresh checkout.
    # It needs no login: it only checks that the files are
    # well-formed. The CLI version is pinned in package.json
    # (2.1.318, verified locally 2026-11-06) and installed from the
    # lockfile with `npm ci`, so the exact bits are hashed.
    # --strict treats warnings as errors; --profile directory
    # additionally checks the plugin-directory submission rules. A
    # green run proves well-formedness only — the repo's own
    # validator checks the deeper rules (frontmatter spec, counts,
    # references, licences).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Claude Code CLI from the lockfile
        run: npm ci
      - name: Validate the plugin (strict)
        run: npx claude plugin validate . --strict
      - name: Validate against the plugin-directory rules (strict)
        run: npx claude plugin validate . --profile directory --strict

  postgres-migration:
    # Proves the migration generator's SQL on a real PostgreSQL.
    # SQLite cannot see the FK-order failure (it lets CREATE TABLE
    # name a FK to a table that does not exist yet, and FK
    # enforcement is DML-only with PRAGMA foreign_keys off), so
    # this job is the only proof the forward SQL runs and the FKs
    # are enforced. The test file skips without DATABASE_URL, so
    # the local suite never needs a database.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: orcinus
          POSTGRES_PASSWORD: orcinus
          POSTGRES_DB: orcinus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CI dependencies (pinned, hashes verified)
        run: pip install --require-hashes -r requirements-ci.txt
      - name: Run the PostgreSQL migration tests
        env:
          DATABASE_URL: postgresql://orcinus:orcinus@localhost:5432/orcinus_test
        run: python3 -m pytest skills/database-designer/test_postgres_migration.py -q
